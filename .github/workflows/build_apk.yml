name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # v2: synopsis preload (AniList batches + TMDB) takes longer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # v2: Firebase options are passed as --dart-define values, extracted
      # from the GOOGLE_SERVICES_JSON secret. No google-services.json file
      # and no Gradle plugin patching are needed. When the secret is absent
      # this step is a no-op and the app builds/runs without sync.
      - name: Extract Firebase options (only if secret present)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              print("No GOOGLE_SERVICES_JSON secret: building without Firebase.")
              raise SystemExit(0)
          try:
              data = json.loads(raw)
              client = data["client"][0]
              info = client["client_info"]
              env = {
                  "FIREBASE_API_KEY": client["api_key"][0]["current_key"],
                  "FIREBASE_APP_ID": info["mobilesdk_app_id"],
                  "FIREBASE_PROJECT_ID": data["project_info"]["project_id"],
                  "FIREBASE_MESSAGING_SENDER_ID": data["project_info"]["project_number"],
                  "FIREBASE_STORAGE_BUCKET": data["project_info"].get("storage_bucket", ""),
                  "FIREBASE_PACKAGE": info["android_client_info"]["package_name"],
              }
          except Exception as e:
              print(f"WARNING: could not parse GOOGLE_SERVICES_JSON ({e}); building without Firebase.")
              raise SystemExit(0)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in env.items():
                  f.write(f"{k}={v}\n")
          print(f"Firebase options extracted for package {env['FIREBASE_PACKAGE']}")
          PY

      - name: Build offline SQLite database (~20k+ anime, synopses preloaded)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python tools/build_db.py

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.sadek --project-name sadek_anime_offline .
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="sadek-anime-offline"/' "$M"
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          # v2: launcher icon (dark version, white line-art on #0F1015)
          if [ -d assets/icon/android ]; then
            cp -r assets/icon/android/. android/app/src/main/res/
          fi

      # v2: fixed release signing key. When KEYSTORE_BASE64 (+ passwords) are
      # set as secrets, the APK is signed with that one key every time, so
      # updates install over the old app and Google sign-in keeps working.
      # Without the secrets the build falls back to the debug key.
      - name: Fixed release signing key (only if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.keystore
            {
              echo "storePassword=${KEYSTORE_PASSWORD:-android}"
              echo "keyPassword=${KEY_PASSWORD:-android}"
              echo "keyAlias=${KEY_ALIAS:-sadek}"
              echo "storeFile=keystore/release.keystore"
            } > android/key.properties
            echo "Fixed signing key configured."
          else
            echo "No signing secrets: using debug key."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=TMDB_API_KEY=${TMDB_API_KEY:-} \
            --dart-define=FIREBASE_API_KEY=${FIREBASE_API_KEY:-} \
            --dart-define=FIREBASE_APP_ID=${FIREBASE_APP_ID:-} \
            --dart-define=FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadek-anime-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
